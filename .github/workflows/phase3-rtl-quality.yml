name: Phase 3 RTL Quality
on:
  push:
    paths:
      - 'labs/phase2_counter/**'
      - 'labs/phase3_quality/**'
      - '.github/workflows/phase3-rtl-quality.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  counter-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install open-source EDA tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog verilator yosys make
      - name: Install cocotb
        run: python -m pip install 'cocotb==2.1.0'
      - name: Run regression and formal gate
        run: |
          PHASE3_PYTHON="$(command -v python)" bash labs/phase3_quality/scripts/run_quality.sh
      - name: Upload local quality reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase3-quality-reports
          path: |
            labs/phase3_quality/reports/runs/
            labs/phase2_counter/reports/runs/
          if-no-files-found: warn

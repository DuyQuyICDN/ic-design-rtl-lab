name: IC Design RTL CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rtl-verification:
    name: RTL + cocotb + Yosys
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install EDA tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            iverilog verilator yosys graphviz \
            gtkwave make

      - name: Install cocotb and pytest
        run: |
          python -m pip install \
            "cocotb==2.1.0" \
            "pytest==9.2.0"

      - name: RTL Verification and Synthesis
        run: bash scripts/full_check.sh

      - name: Python cocotb Verification
        run: |
          python -m pytest -s \
            cocotb_tests/test_runner.py

      - name: Final result
        run: echo "IC DESIGN CI PASSED"
